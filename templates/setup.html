{% extends "base.html" %}
{% block title %}First setup - CAD Lite{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>First time setup</h1>
  <p>Create the first admin account. This page only works while there are no accounts yet.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Admin username <input name="username" required></label>
    <label>Admin password (6 or more characters) <input type="password" name="password" required></label>
    <button type="submit">Create admin</button>
  </form>
</div>
{% endblock %}
