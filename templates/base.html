<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CAD{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">CAD Lite</div>
  {% if me['role'] == 'unit' %}
  <nav>
    <a href="{{ url_for('unit_home') }}">My calls</a>
    <span class="who">{{ me['username'] }}</span>
    <a href="{{ url_for('logout') }}">Log out</a>
  </nav>
  {% elif me %}
  <nav>
    <a href="{{ url_for('board') }}">Board</a>
    <a href="{{ url_for('units_page') }}">Units</a>
    <a href="{{ url_for('sops') }}">SOPs</a>
    <a href="{{ url_for('export_csv') }}">Export CSV</a>
    {% if me['role'] == 'admin' %}
      <a href="{{ url_for('users') }}">Users</a>
      <a href="{{ url_for('audit') }}">Audit log</a>
      <a href="{{ url_for('settings_page') }}">Settings</a>
    {% endif %}
    <span class="who">{{ me['username'] }}</span>
    <a href="{{ url_for('logout') }}">Log out</a>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
